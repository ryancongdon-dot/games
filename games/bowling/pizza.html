<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0c1020" />
  <title>Pizza Counter — Strike Valley Lanes 🍕</title>
  <link rel="stylesheet" href="hub.css" />
  <link rel="stylesheet" href="pizza.css" />
</head>
<body>
  <div id="hub" class="pizza-page">
    <!-- HUD -->
    <div class="pz-hud">
      <span class="chip">💰 <b id="c-earned">$0</b></span>
      <span class="chip">👍 <b id="c-served">0</b></span>
      <span class="chip">🔥 <b id="c-combo">x0</b></span>
      <span class="chip clock">⏰ <b id="c-clock">1:30</b></span>
    </div>

    <!-- the restaurant scene: customers at the counter -->
    <section class="scene">
      <div class="scene-bg">
        <div class="neon">🍕 LANESIDE PIZZA</div>
        <div class="shelf"></div>
      </div>
      <div id="seats" class="seats"></div>
      <div class="counter"></div>
    </section>

    <!-- prep station -->
    <section class="prep">
      <div class="prep-left">
        <div class="cook">🧑‍🍳</div>
        <div id="prep-pizza" class="pizza"><div class="pie"></div><div id="pizza-tops" class="pizza-tops"></div></div>
      </div>
      <div class="prep-right">
        <div id="prep-info" class="prep-info">Tap a customer to take their order</div>
        <div id="toppings" class="toppings"></div>
        <div id="bakebar" class="bakebar hidden"><span class="zone-good"></span><div id="bake-needle" class="bake-needle"></div></div>
        <button id="btn-main" class="bowl hidden">BAKE 🔥</button>
      </div>
    </section>

    <footer class="hub-foot"><a href="index.html">← Back to the Alley</a></footer>

    <!-- shift summary -->
    <div id="overlay" class="overlay hidden">
      <div class="card">
        <h2 id="sum-title">Shift Over</h2>
        <div id="sum-body"></div>
        <button id="btn-again" class="primary">Work Another Shift</button>
        <button id="btn-hub" class="primary ghost">Back to the Alley</button>
      </div>
    </div>
  </div>

  <script src="league.js"></script>
  <script src="pizza.js"></script>
</body>
</html>
