<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0c1020" />
  <title>Strike Valley Lanes — 3D 🎳</title>
  <link rel="stylesheet" href="hub.css" />
  <link rel="stylesheet" href="alley.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <div id="world">
    <canvas id="scene"></canvas>

    <div class="w-hud">
      <span class="chip">📅 <b id="c-week">Week 1</b></span>
      <span class="chip">🏆 <b id="c-rank">#1</b></span>
      <span class="chip">💵 <b id="c-money">$0</b></span>
      <span class="chip">🎳 <b id="c-ball">House Ball</b></span>
    </div>

    <div id="loading" class="w-loading">Loading the alley…</div>
    <div id="prompt" class="w-prompt hidden"></div>

    <div class="w-controls">
      <button id="b-left" class="w-btn">◀</button>
      <div class="w-updown"><button id="b-up" class="w-btn">▲</button><button id="b-down" class="w-btn">▼</button></div>
      <button id="b-act" class="w-btn act">●</button>
      <button id="b-right" class="w-btn">▶</button>
    </div>

    <div id="board-ov" class="overlay hidden">
      <div class="card">
        <h2>League Standings</h2>
        <div class="thead"><span class="t-pos">#</span><span class="t-name">Team</span><span class="t-rec">W–L</span><span class="t-pf">PF</span></div>
        <div id="standings" class="standings"></div>
        <button id="board-close" class="primary">Close</button>
      </div>
    </div>
  </div>

  <script src="league.js"></script>
  <script src="sprites.js"></script>
  <script src="story.js"></script>
  <script src="audio.js"></script>
  <script type="module" src="alley3d.js"></script>
</body>
</html>
